
<div class="login-container">
  <h2>Login</h2>

  <app-dynamic-form
    [questions]="questions"
    (submitEvent)="onSubmit($event)">
  </app-dynamic-form>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
<div>
  <p class="mt-3">
    Don't have an account? <a  style=" cursor: pointer;
      color: blue;" (click)="goToRegister()">Register here</a>.
  </p>
</div>
<button (click)="onBack()">BACK TO HOMEPAGE</button>
