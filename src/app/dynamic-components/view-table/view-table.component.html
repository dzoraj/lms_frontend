<ng-template #praznaTabela>
    <tbody>
      <tr>
        <td colspan="7">No data to load</td>
      </tr>
    </tbody>
</ng-template>

<table>
    <thead>
        <tr>
            @for (column of columns; track $index){
                <td><button (click)="sort(column)">{{column}}</button></td>
            }

        </tr>
    </thead>
    <tbody *appNoData="data; template: praznaTabela">
        @for (row of data; track row){
            <tr>
                @for (column of columns; track $index){
                    <td>
                    <a *ngIf="rowLinkFn && column === 'name'; else plainText" [routerLink]="rowLinkFn(row)">
                        {{ getValue(row, column) }}
                    </a>
                    <ng-template #plainText>{{ getValue(row, column) }}</ng-template>
                    </td>
                                    }

            </tr>
        }
    </tbody>
</table>
<button (click)="onBack()">BACK TO HOMEPAGE</button>
